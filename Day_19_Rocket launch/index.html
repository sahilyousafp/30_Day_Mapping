<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Rocket Launches 3D</title>
    
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            background: #0a0e27;
        }
        
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        
        .title {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 35px;
            border-radius: 50px;
            z-index: 1;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
        }
        
        .title h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        
        .stats-panel {
            position: absolute;
            top: 100px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1;
        }
        
        .stat-card {
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            min-width: 200px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .stat-label {
            font-size: 12px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .legend {
            position: absolute;
            bottom: 25px;
            left: 25px;
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            z-index: 1;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .legend h3 {
            font-size: 14px;
            color: #fff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: #a0aec0;
        }
        
        .legend-bar {
            width: 50px;
            height: 8px;
            margin-right: 12px;
            border-radius: 4px;
        }
        
        #tooltip {
            position: absolute;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 999;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        #tooltip .country-name {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0e27;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
        }
        
        .loading.hidden {
            display: none;
        }
        
        .loading h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="title">
        <h1>ROCKET LAUNCHES</h1>
    </div>
    
    <div class="stats-panel">
        <div class="stat-card">
            <div class="stat-label">Total Launches</div>
            <div class="stat-value" id="total-launches">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Countries</div>
            <div class="stat-value" id="country-count">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Top Country</div>
            <div class="stat-value" id="top-country" style="font-size: 20px;">-</div>
        </div>
    </div>
    
    <div class="legend">
        <h3>Launch Count</h3>
        <div class="legend-item">
            <div class="legend-bar" style="background: linear-gradient(90deg, #10b981, #34d399);"></div>
            <span>1 - 20</span>
        </div>
        <div class="legend-item">
            <div class="legend-bar" style="background: linear-gradient(90deg, #f59e0b, #fbbf24);"></div>
            <span>21 - 50</span>
        </div>
        <div class="legend-item">
            <div class="legend-bar" style="background: linear-gradient(90deg, #f97316, #fb923c);"></div>
            <span>51 - 100</span>
        </div>
        <div class="legend-item">
            <div class="legend-bar" style="background: linear-gradient(90deg, #ef4444, #f87171);"></div>
            <span>101 - 200</span>
        </div>
        <div class="legend-item">
            <div class="legend-bar" style="background: linear-gradient(90deg, #dc2626, #991b1b);"></div>
            <span>200+</span>
        </div>
    </div>
    
    <div id="tooltip"></div>
    
    <div class="loading" id="loading">
        <h2>Loading Visualization...</h2>
        <div class="loader"></div>
    </div>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <script src="https://unpkg.com/deck.gl@8.9.0/dist.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
